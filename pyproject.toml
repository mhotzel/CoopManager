[project]
name = "coop-manager"
version = "0.1.0"
description = "This application is intended to support cooperatives managing there members"
readme = "README.md"
authors = [
    { name = "Matthias Hotzel", email = "matthias@die-hotzels.de" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "flask>=3.1.3",
]

[project.scripts]
coop = "coop_manager.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
